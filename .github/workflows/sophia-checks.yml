# Runs the SOPHIA safety net (architecture check, build, unit and functional tests, agent-kit
# proposals) on the FICTIONAL sample documents in sophia/samples for every change to sophia/.
name: SOPHIA checks
on:
  push:
    paths: ['sophia/**', '.github/workflows/sophia-checks.yml']
  pull_request:
    paths: ['sophia/**']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright with Chromium
        working-directory: sophia
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Safety net on the fictional samples
        run: bash sophia/tools/check.sh
        env:
          SOPHIA_OUT: ${{ runner.temp }}/sophia
      - name: Keep the outputs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sophia-check-output
          path: ${{ runner.temp }}/sophia
